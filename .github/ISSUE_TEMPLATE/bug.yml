name: Bug report
description: Report a reproducible problem in Exo.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include private notes, credentials, or terminal output."
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the expected behavior and the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Exo version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, hardware, and relevant setup details.
