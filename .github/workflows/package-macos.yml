name: Package macOS

on:
  workflow_dispatch:

jobs:
  package:
    name: Build unsigned macOS artifacts
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate source
        run: pnpm check

      - name: Package macOS app
        run: pnpm dist:mac

      - name: Locate packaged app
        shell: bash
        run: |
          APP_PATH="$(find release -type d -path '*/Exograph.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/Exograph"
          echo "EXOGRAPH_PACKAGED_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Exercise packaged app
        run: |
          pnpm test:packaged:containment
          pnpm --filter @exograph/desktop exec playwright test tests/e2e/onboarding.spec.ts -g "completes and restarts the real packaged first-run journey"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exograph-macos-unsigned
          path: release/*
          if-no-files-found: error
          retention-days: 14
