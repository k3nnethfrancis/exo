name: Package macOS candidate

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: package-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build unsigned arm64 candidate
    runs-on: macos-15
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 11.2.2

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve candidate version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for MANIFEST in apps/desktop/package.json packages/core/package.json packages/cli/package.json; do
            PACKAGE_VERSION="$(node -p "require('./${MANIFEST}').version")"
            if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
              echo "Version mismatch: $MANIFEST is $PACKAGE_VERSION; root is $VERSION." >&2
              exit 1
            fi
          done
          echo "EXOGRAPH_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Validate source
        run: pnpm ci:check

      - name: Package macOS app
        run: pnpm dist:mac

      - name: Locate packaged app
        shell: bash
        run: |
          APP_PATH="$(find "$GITHUB_WORKSPACE/release" -type d -path '*/Exograph.app' -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/Contents/MacOS/Exograph"
          echo "EXOGRAPH_PACKAGED_APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Exercise packaged app
        run: |
          pnpm test:packaged:containment
          pnpm --filter @exograph/desktop exec playwright test tests/e2e/onboarding.spec.ts -g "completes and restarts the real packaged first-run journey"
          EXOGRAPH_PACKAGED_APP_PATH="$EXOGRAPH_PACKAGED_APP_PATH/Contents/MacOS/Exograph" \
            pnpm --filter @exograph/desktop exec playwright test tests/e2e/gate-d-gpu-terminal-smoke.spec.ts
          EXOGRAPH_PACKAGED_APP_PATH="$EXOGRAPH_PACKAGED_APP_PATH/Contents/MacOS/Exograph" \
            pnpm --filter @exograph/desktop exec playwright test tests/e2e/packaged-qmd-smoke.spec.ts

      - name: Prepare release artifacts
        shell: bash
        run: |
          EXPECTED_DMG="release/Exograph-${EXOGRAPH_RELEASE_VERSION}-mac-arm64.dmg"
          EXPECTED_ZIP="release/Exograph-${EXOGRAPH_RELEASE_VERSION}-mac-arm64.zip"
          test -f "$EXPECTED_DMG"
          test -f "$EXPECTED_ZIP"
          rm -rf release-assets
          mkdir release-assets
          for FILE in "$EXPECTED_DMG" "$EXPECTED_ZIP"; do
            BASENAME="$(basename "$FILE")"
            cp "$FILE" "release-assets/$BASENAME"
          done
          (
            cd release-assets
            shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: exograph-${{ env.EXOGRAPH_RELEASE_VERSION }}-macos-arm64-unsigned
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload packaged-app failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packaged-app-failure-${{ github.run_id }}
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7
